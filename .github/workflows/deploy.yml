name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Unique build id, used by the in-app update check
      - name: Stamp build version
        run: |
          proj="$(dirname "$(find . -name SpiderBlazor.csproj | head -n 1)")"
          echo "{\"build\":\"${{ github.run_number }}-${GITHUB_SHA::7}\"}" > "$proj/wwwroot/version.json"

      # Finds the project wherever it sits in the repo
      - name: Publish
        run: dotnet publish "$(find . -name SpiderBlazor.csproj | head -n 1)" -c Release -o release

      - name: Disable Jekyll
        run: touch release/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
